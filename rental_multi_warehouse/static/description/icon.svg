<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="10" fill="#714B67"/>
  <g fill="white" opacity="0.9">
    <!-- Warehouse 1 -->
    <rect x="10" y="45" width="25" height="20" rx="2"/>
    <polygon points="10,45 22.5,33 35,45"/>
    <!-- Warehouse 2 -->
    <rect x="65" y="45" width="25" height="20" rx="2"/>
