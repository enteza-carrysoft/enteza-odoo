    <!-- Arrow between -->
    <line x1="38" y1="55" x2="60" y2="55" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <polygon points="60,50 68,55 60,60"/>
    <!-- Truck icon below -->
    <rect x="35" y="72" width="20" height="10" rx="2"/>
    <rect x="55" y="75" width="8" height="7" rx="1"/>
    <circle cx="40" cy="84" r="3"/>
    <circle cx="50" cy="84" r="3"/>
    <circle cx="60" cy="84" r="3"/>
  </g>
</svg>
